global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'hms-backend'
    # NOTE: /api/health returns JSON, not Prometheus exposition format.
    # For proper monitoring, integrate prom-client in the backend and expose /api/metrics.
    metrics_path: '/api/health'
    scheme: http
    static_configs:
      - targets: ['backend:5000']
